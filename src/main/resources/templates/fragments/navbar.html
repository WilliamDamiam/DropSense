<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<body>

<!-- Thanh điều hướng dùng chung -->
<nav th:fragment="mainNavbar"
     class="navbar navbar-expand-lg navbar-dark">

    <div class="container">

        <!-- Logo -->
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-mortarboard-fill me-2"></i>
            DropSense
        </a>

        <!-- Menu điện thoại -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Mở menu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">

            <!-- Các chức năng chính -->
            <ul class="navbar-nav ms-auto align-items-lg-center">

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">
                        Trang chủ
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/students}">
                        Sinh viên
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/assessments}">
                        Đánh giá
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/assessments/history}">
                        Lịch sử
                    </a>
                </li>

            </ul>

            <!-- Tài khoản người dùng -->
            <div class="d-flex align-items-center gap-3 ms-lg-4 mt-3 mt-lg-0">

                <!-- Xin chào -->
                <a th:href="@{/profile}"
                   class="text-white text-decoration-none">

                    <small>
                        Xin chào,
                        <strong th:text="${currentUsername}">
                            Username
                        </strong>
                    </small>

                </a>

                <!-- Menu avatar -->
                <div class="dropdown">

                    <button type="button"
                            class="avatar-button dropdown-toggle"
                            data-bs-toggle="dropdown"
                            aria-expanded="false"
                            aria-label="Mở menu tài khoản">

                        <!-- Có ảnh đại diện -->
                        <img th:if="${hasAvatar == true}"
                             th:src="@{/profile/avatar(v=${avatarVersion})}"
                             alt="Ảnh đại diện"
                             class="rounded-circle"
                             style="width: 100%; height: 100%; object-fit: cover;">

                        <!-- Chưa có ảnh thì hiện chữ cái -->
                        <span th:unless="${hasAvatar == true}"
                              th:text="${avatarInitial}">
                            U
                        </span>

                    </button>

                    <!-- Dropdown -->
                    <ul class="dropdown-menu dropdown-menu-end shadow">

                        <li>
                            <h6 class="dropdown-header"
                                th:text="${currentUsername}">
                                Username
                            </h6>
                        </li>

                        <li>
                            <span class="dropdown-item-text small text-secondary"
                                  th:text="${currentRole}">
                                Vai trò
                            </span>
                        </li>

                        <li>
                            <hr class="dropdown-divider">
                        </li>

                        <!-- Hồ sơ cá nhân -->
                        <li>
                            <a class="dropdown-item"
                               th:href="@{/profile}">

                                <i class="bi bi-person-circle me-2"></i>
                                Hồ sơ cá nhân

                            </a>
                        </li>

                        <li>
                            <hr class="dropdown-divider">
                        </li>

                        <!-- Đăng xuất -->
                        <li>
                            <form th:action="@{/logout}" method="post">

                                <button type="submit"
                                        class="dropdown-item text-danger">

                                    <i class="bi bi-box-arrow-right me-2"></i>
                                    Đăng xuất

                                </button>

                            </form>
                        </li>

                    </ul>

                </div>

            </div>

        </div>

    </div>

</nav>

</body>
</html>
