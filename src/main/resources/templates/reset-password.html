<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="referrer" content="no-referrer">

    <title>Đặt lại mật khẩu - DropSense</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body
        {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e3a8a, #2563eb);
            font-family: Arial, sans-serif;
        }

        /* Khung đặt lại mật khẩu */
        .reset-box
        {
            max-width: 480px;
            width: 100%;
            background-color: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.2);
        }

        /* Biểu tượng khóa */
        .reset-icon
        {
            width: 70px;
            height: 70px;
            background-color: #dbeafe;
            color: #2563eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: auto;
        }

        .form-control
        {
            border-radius: 10px;
            padding: 12px;
        }

        .form-control:focus
        {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .btn-primary
        {
            background-color: #2563eb;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
        }

        .btn-primary:hover
        {
            background-color: #1d4ed8;
        }

        @media (max-width: 576px)
        {
            .reset-box
            {
                padding: 28px 22px;
            }
        }
    </style>


    <!-- Favicon DropSense -->
    <link rel="icon"
          type="image/x-icon"
          th:href="@{/favicon.ico(v=2)}">

</head>

<body>

<div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">

    <div class="reset-box">

        <!-- BIỂU TƯỢNG -->
        <div class="reset-icon mb-3">
            <i class="bi bi-shield-lock-fill"></i>
        </div>

        <!-- TIÊU ĐỀ -->
        <div class="text-center mb-4">

            <h3 class="fw-bold">
                Đặt lại mật khẩu
            </h3>

            <p class="text-secondary">
                Nhập mật khẩu mới để khôi phục
                quyền truy cập tài khoản DropSense.
            </p>

        </div>

        <!-- THÔNG BÁO LỖI -->
        <div class="alert alert-danger"
             th:if="${error != null}">

            <i class="bi bi-exclamation-triangle me-2"></i>
            <span th:text="${error}"></span>

        </div>

        <!-- TOKEN KHÔNG HỢP LỆ -->
        <div th:if="${validToken != true}">

            <div class="alert alert-warning text-center">

                <i class="bi bi-clock-history fs-3 d-block mb-2"></i>

                Liên kết đặt lại mật khẩu không hợp lệ,
                đã hết hạn hoặc đã được sử dụng.

            </div>

            <a th:href="@{/forgot-password}"
               class="btn btn-primary w-100">

                <i class="bi bi-arrow-repeat me-1"></i>
                Yêu cầu liên kết mới

            </a>

        </div>

        <!-- FORM ĐẶT LẠI MẬT KHẨU -->
        <form th:if="${validToken == true}"
              th:action="@{/reset-password}"
              method="post">

            <!-- Gửi token về Controller -->
            <input type="hidden"
                   name="token"
                   th:value="${token}">

            <!-- Mật khẩu mới -->
            <div class="mb-3">

                <label for="newPassword"
                       class="form-label fw-semibold">

                    <i class="bi bi-lock me-1"></i>
                    Mật khẩu mới

                </label>

                <input type="password"
                       id="newPassword"
                       name="newPassword"
                       class="form-control"
                       placeholder="Nhập mật khẩu mới"
                       minlength="10"
                       autocomplete="new-password"
                       required>

                <small class="text-secondary">
                    Ít nhất 10 ký tự, gồm số và ký tự đặc biệt.
                </small>

            </div>

            <!-- Nhập lại mật khẩu -->
            <div class="mb-3">

                <label for="confirmPassword"
                       class="form-label fw-semibold">

                    <i class="bi bi-shield-check me-1"></i>
                    Xác nhận mật khẩu

                </label>

                <input type="password"
                       id="confirmPassword"
                       name="confirmPassword"
                       class="form-control"
                       placeholder="Nhập lại mật khẩu mới"
                       minlength="10"
                       autocomplete="new-password"
                       required>

            </div>

            <!-- Hiện hoặc ẩn mật khẩu -->
            <div class="form-check mb-4">

                <input type="checkbox"
                       class="form-check-input"
                       id="showPassword"
                       onclick="hienMatKhau()">

                <label for="showPassword"
                       class="form-check-label">

                    Hiển thị mật khẩu

                </label>

            </div>

            <!-- Nút lưu mật khẩu -->
            <div class="d-grid">

                <button type="submit"
                        class="btn btn-primary">

                    <i class="bi bi-check-circle me-2"></i>
                    Lưu mật khẩu mới

                </button>

            </div>

        </form>

        <hr class="my-4">

        <!-- QUAY LẠI ĐĂNG NHẬP -->
        <div class="text-center">

            <a th:href="@{/login}"
               class="text-decoration-none fw-semibold">

                <i class="bi bi-arrow-left me-1"></i>
                Quay lại đăng nhập

            </a>

        </div>

        <!-- FOOTER -->
        <div class="text-center mt-4">

            <small class="text-secondary">
                © 2026 DropSense - Nhóm 2A
            </small>

        </div>

    </div>

</div>

<!-- JavaScript hiện hoặc ẩn mật khẩu -->
<script>
    function hienMatKhau()
    {
        var password = document.getElementById("newPassword");
        var confirmPassword = document.getElementById("confirmPassword");
        var checkbox = document.getElementById("showPassword");

        if (checkbox.checked)
        {
            password.type = "text";
            confirmPassword.type = "text";
        }
        else
        {
            password.type = "password";
            confirmPassword.type = "password";
        }
    }
</script>

</body>
</html>
