<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hồ sơ cá nhân - DropSense</title>


    <!-- Favicon DropSense -->
    <link rel="icon"
          type="image/x-icon"
          th:href="@{/favicon.ico(v=2)}">


    <!-- Bootstrap 5 và CSS chung -->
    <th:block th:replace="~{fragments/header :: commonHeader}"></th:block>
</head>

<body class="bg-light">

<!-- Thanh điều hướng -->
<div th:replace="~{fragments/navbar :: mainNavbar}"></div>

<main class="container py-5">

    <div class="card border-0 shadow-sm mx-auto" style="max-width: 650px;">

        <div class="card-body p-4">

            <!-- Thông báo thành công -->
            <div th:if="${success != null}" class="alert alert-success" data-auto-hide>
                <i class="bi bi-check-circle me-2"></i>
                <span th:text="${success}"></span>
            </div>

            <!-- Thông báo lỗi -->
            <div th:if="${error != null}" class="alert alert-danger">
                <i class="bi bi-exclamation-triangle me-2"></i>
                <span th:text="${error}"></span>
            </div>

            <!-- THÔNG TIN NGƯỜI DÙNG -->
            <div class="text-center mb-4">

                <!-- Avatar -->
                <div class="profile-avatar mx-auto mb-3 overflow-hidden">

                    <!-- Ảnh đại diện -->
                    <img id="avatarImage"
                         th:src="${hasAvatar == true} ? @{/profile/avatar(v=${avatarVersion})} : null"
                         th:classappend="${hasAvatar != true} ? 'd-none' : ''"
                         alt="Ảnh đại diện"
                         style="width: 100%; height: 100%; object-fit: cover;">

                    <!-- Chữ cái mặc định khi chưa có ảnh -->
                    <span id="avatarText"
                          th:classappend="${hasAvatar == true} ? 'd-none' : ''"
                          th:text="${avatarInitial}">
                        U
                    </span>

                </div>

                <!-- Tên đăng nhập -->
                <h4 class="fw-bold" th:text="${currentUsername}">
                    Username
                </h4>

                <!-- Vai trò -->
                <span class="badge bg-primary" th:text="${currentRole}">
                    Vai trò
                </span>

            </div>

            <hr>

            <!-- CẬP NHẬT AVATAR -->
            <h5 class="fw-bold mb-3">
                <i class="bi bi-camera text-primary me-2"></i>
                Cập nhật ảnh đại diện
            </h5>

            <form th:action="@{/profile/avatar}"
                  method="post"
                  enctype="multipart/form-data">

                <div class="mb-3">

                    <label for="avatar" class="form-label">
                        Chọn ảnh đại diện
                    </label>

                    <input type="file"
                           class="form-control"
                           id="avatar"
                           name="avatar"
                           accept=".jpg,.jpeg,.png"
                           onchange="xemTruocAnh()"
                           required>

                    <small class="text-secondary">
                        Chỉ hỗ trợ JPG, PNG. Tối đa 2 MB.
                    </small>

                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-cloud-arrow-up me-1"></i>
                    Lưu ảnh đại diện
                </button>

            </form>

            <hr class="my-4">

            <!-- THÔNG TIN TÀI KHOẢN -->
            <h5 class="fw-bold mb-3">
                <i class="bi bi-person-vcard me-2"></i>
                Thông tin tài khoản
            </h5>

            <div class="mb-3">
                <label class="text-secondary">Tên đăng nhập</label>
                <p class="fw-semibold" th:text="${currentUsername}"></p>
            </div>

            <div class="mb-4">
                <label class="text-secondary">Vai trò</label>
                <p class="fw-semibold" th:text="${currentRole}"></p>
            </div>

            <!-- Quay về trang chủ -->
            <a th:href="@{/}" class="btn btn-outline-primary">
                <i class="bi bi-arrow-left me-1"></i>
                Quay về trang chủ
            </a>

        </div>

    </div>

</main>

<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- JavaScript chung -->
<script th:src="@{/js/main.js}"></script>

<!-- JavaScript xem trước avatar -->
<script>

    function xemTruocAnh()
    {
        // Lấy các phần tử HTML
        var input = document.getElementById("avatar");
        var image = document.getElementById("avatarImage");
        var text = document.getElementById("avatarText");

        // Lấy file người dùng chọn
        var file = input.files[0];

        if (!file)
        {
            return;
        }

        // Kiểm tra định dạng file
        if (file.type != "image/jpeg" && file.type != "image/png")
        {
            alert("Chỉ được chọn ảnh JPG hoặc PNG!");
            input.value = "";
            return;
        }

        // Kiểm tra dung lượng file
        if (file.size > 2 * 1024 * 1024)
        {
            alert("Ảnh không được vượt quá 2 MB!");
            input.value = "";
            return;
        }

        // Đọc ảnh từ máy tính
        var reader = new FileReader();

        reader.onload = function(event)
        {
            // Hiển thị ảnh đã chọn
            image.src = event.target.result;
            image.classList.remove("d-none");

            // Ẩn avatar chữ cái
            text.classList.add("d-none");
        };

        reader.readAsDataURL(file);
    }

</script>

</body>
</html>
