
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quản lý sinh viên - DropSense</title>

    <!-- Favicon DropSense -->
    <link rel="icon"
          type="image/x-icon"
          th:href="@{/favicon.ico(v=2)}">


    <!-- Bootstrap 5 và CSS dùng chung -->
    <th:block th:replace="~{fragments/header :: commonHeader}"></th:block>
</head>

<body class="bg-light">

<!-- Thanh điều hướng -->
<div th:replace="~{fragments/navbar :: mainNavbar}"></div>

<main class="container py-4">

    <!-- Tiêu đề trang -->
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">

        <div>
            <h3 class="fw-bold text-primary mb-1">
                <i class="bi bi-people-fill me-2"></i>
                Quản lý sinh viên
            </h3>

            <p class="text-secondary mb-0">
                Danh sách sinh viên và thông tin học tập
            </p>
        </div>

        <!-- Chỉ ADMIN mới được thêm sinh viên -->
        <a th:if="${isAdmin}"
           th:href="@{/students/new}"
           class="btn btn-primary">

            <i class="bi bi-person-plus me-1"></i>
            Thêm sinh viên
        </a>

    </div>

    <!-- Thông báo thành công, tự ẩn sau 5 giây -->
    <div class="alert alert-success alert-dismissible fade show"
         th:if="${success != null}"
         data-auto-hide>

        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${success}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Đóng">
        </button>
    </div>

    <!-- Thông báo lỗi -->
    <div class="alert alert-danger alert-dismissible fade show"
         th:if="${error != null}">

        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${error}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Đóng">
        </button>
    </div>

    <!-- Thống kê tổng số sinh viên -->
    <div class="card border-0 shadow-sm mb-4">

        <div class="card-body d-flex align-items-center gap-3">

            <div class="bg-primary-subtle text-primary rounded-3 p-3">
                <i class="bi bi-people-fill fs-3"></i>
            </div>

            <div>
                <p class="text-secondary mb-1">
                    Tổng số sinh viên
                </p>

                <h3 class="fw-bold mb-0"
                    th:text="${totalStudents}">
                    0
                </h3>
            </div>

        </div>
    </div>

    <!-- Bảng danh sách sinh viên -->
    <div class="card border-0 shadow-sm">

        <div class="card-header bg-white py-3">

            <div class="row align-items-center g-3">

                <div class="col-md-5">
                    <h5 class="fw-bold mb-0">
                        <i class="bi bi-table me-2"></i>
                        Danh sách sinh viên
                    </h5>
                </div>

                <!-- Form tìm kiếm sinh viên -->
                <div class="col-md-7">

                    <form th:action="@{/students}"
                          method="get"
                          class="d-flex gap-2">

                        <input type="text"
                               name="keyword"
                               class="form-control"
                               placeholder="Nhập họ tên sinh viên..."
                               th:value="${keyword}">

                        <button type="submit"
                                class="btn btn-primary">

                            <i class="bi bi-search me-1"></i>
                            Tìm
                        </button>

                        <!-- Làm mới danh sách -->
                        <a th:href="@{/students}"
                           class="btn btn-outline-secondary"
                           title="Làm mới">

                            <i class="bi bi-arrow-clockwise"></i>
                        </a>

                    </form>

                </div>
            </div>
        </div>

        <div class="card-body p-0">

            <!-- Bảng có thể cuộn ngang trên điện thoại -->
            <div class="table-responsive">

                <table class="table table-bordered table-hover align-middle mb-0">

                    <thead class="table-light">
                    <tr>
                        <th>Mã SV</th>
                        <th>Họ và tên</th>
                        <th>GPA tích lũy</th>
                        <th>GPA kỳ trước</th>
                        <th>GPA kỳ này</th>
                        <th>Môn trượt</th>
                        <th>Hoàn thành TC</th>
                        <th>Chuyên cần</th>
                        <th th:if="${isAdmin}">Thao tác</th>
                    </tr>
                    </thead>

                    <tbody>

                    <!-- Hiển thị danh sách sinh viên từ MySQL -->
                    <tr th:each="student : ${students}">

                        <td th:text="${student.studentId}"></td>

                        <td class="fw-semibold"
                            th:text="${student.fullName}">
                        </td>

                        <td th:text="${student.gpa}"></td>

                        <td th:text="${student.previousGpa}"></td>

                        <td th:text="${student.currentGpa}"></td>

                        <td th:text="${student.failedCourses}"></td>

                        <td th:text="${student.creditCompletionRate + '%'}"></td>

                        <td th:text="${student.attendanceRate + '%'}"></td>

                        <!-- Các thao tác chỉ dành cho ADMIN -->
                        <td th:if="${isAdmin}">

                            <div class="d-flex gap-2">

                                <!-- Nút sửa -->
                                <a th:href="@{/students/edit/{id}(id=${student.studentId})}"
                                   class="btn btn-warning btn-sm">

                                    <i class="bi bi-pencil-square me-1"></i>
                                    Sửa
                                </a>

                                <!-- Form xóa sinh viên -->
                                <form th:action="@{/students/delete/{id}(id=${student.studentId})}"
                                      method="post"
                                      data-confirm="Bạn có chắc muốn xóa sinh viên này?">

                                    <button type="submit"
                                            class="btn btn-danger btn-sm">

                                        <i class="bi bi-trash me-1"></i>
                                        Xóa
                                    </button>

                                </form>

                            </div>

                        </td>
                    </tr>

                    <!-- Trường hợp không có sinh viên -->
                    <tr th:if="${#lists.isEmpty(students)}">

                        <td th:colspan="${isAdmin} ? 9 : 8"
                            class="text-center text-secondary py-4">

                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Không tìm thấy sinh viên nào.

                        </td>

                    </tr>

                    </tbody>
                </table>

            </div>
        </div>

        <!-- Chân bảng -->
        <div class="card-footer bg-white text-secondary py-3">

            <small>
                Dữ liệu được quản lý bởi hệ thống DropSense.
            </small>

        </div>
    </div>

</main>

<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- JavaScript riêng của DropSense -->
<script th:src="@{/js/main.js}"></script>

</body>
</html>
