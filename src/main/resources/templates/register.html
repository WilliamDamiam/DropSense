
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng ký - DropSense</title>

    <!-- Favicon DropSense -->
    <link rel="icon"
          type="image/x-icon"
          th:href="@{/favicon.ico(v=2)}">


    <th:block th:replace="~{fragments/header :: commonHeader}"></th:block>
</head>

<body class="bg-light">

<main class="container py-5">

    <div class="card border-0 shadow-sm mx-auto" style="max-width: 500px;">

        <div class="card-body p-4">

            <!-- Logo và tiêu đề -->
            <div class="text-center mb-4">

                <h3 class="fw-bold text-primary">
                    <i class="bi bi-mortarboard-fill me-2"></i>
                    DropSense
                </h3>

                <h4 class="fw-bold mt-3">
                    Đăng ký tài khoản
                </h4>

                <p class="text-secondary">
                    Tạo tài khoản để sử dụng hệ thống.
                </p>

            </div>

            <!-- Thông báo lỗi -->
            <div th:if="${error != null}" class="alert alert-danger">
                <i class="bi bi-exclamation-triangle me-2"></i>
                <span th:text="${error}"></span>
            </div>

            <!-- Form đăng ký -->
            <form th:action="@{/register}" method="post">

                <!-- Tên đăng nhập -->
                <div class="mb-3">

                    <label for="username" class="form-label fw-semibold">
                        Tên đăng nhập
                    </label>

                    <input type="text"
                           id="username"
                           name="username"
                           class="form-control"
                           th:value="${username}"
                           placeholder="Nhập tên đăng nhập"
                           minlength="5"
                           maxlength="30"
                           pattern="[a-zA-Z0-9_]{5,30}"
                           autocomplete="username"
                           required>

                    <small class="text-secondary">
                        Từ 5 đến 30 ký tự, gồm chữ, số và dấu gạch dưới.
                    </small>

                </div>

                <!-- Email -->
                <div class="mb-3">

                    <label for="email" class="form-label fw-semibold">
                        Email
                    </label>

                    <input type="email"
                           id="email"
                           name="email"
                           class="form-control"
                           th:value="${email}"
                           placeholder="Nhập email của bạn"
                           maxlength="254"
                           autocomplete="email"
                           required>

                </div>

                <!-- Mật khẩu -->
                <div class="mb-3">

                    <label for="password" class="form-label fw-semibold">
                        Mật khẩu
                    </label>

                    <input type="password"
                           id="password"
                           name="password"
                           class="form-control"
                           placeholder="Nhập mật khẩu"
                           minlength="10"
                           autocomplete="new-password"
                           required>

                    <small class="text-secondary">
                        Ít nhất 10 ký tự, có số và ký tự đặc biệt.
                    </small>

                </div>

                <!-- Nhập lại mật khẩu -->
                <div class="mb-4">

                    <label for="confirmPassword" class="form-label fw-semibold">
                        Nhập lại mật khẩu
                    </label>

                    <input type="password"
                           id="confirmPassword"
                           name="confirmPassword"
                           class="form-control"
                           placeholder="Nhập lại mật khẩu"
                           autocomplete="new-password"
                           required>

                </div>

                <!-- Nút đăng ký -->
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-person-plus me-1"></i>
                    Đăng ký tài khoản
                </button>

            </form>

            <hr class="my-4">

            <!-- Chuyển sang trang đăng nhập -->
            <p class="text-center mb-0">

                Đã có tài khoản?

                <a th:href="@{/login}" class="fw-semibold">
                    Đăng nhập
                </a>

            </p>

        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
